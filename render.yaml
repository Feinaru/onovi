# Render Blueprint for Onovi Application
# This file defines the infrastructure for deploying Onovi on Render.com

# Database
databases:
  - name: onovi-db
    databaseName: onovi_production
    user: onovi
    region: oregon
    plan: starter  # Free tier - upgrade to starter for production
    ipAllowList: []  # Empty means accessible from anywhere

# Backend API Service
services:
  - type: web
    name: onovi-api
    env: node
    region: oregon
    plan: starter  # Free tier - upgrade to starter for production
    buildCommand: cd server && npm install && npx prisma generate
    startCommand: cd server && npm run db:migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onovi-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NOMINATIM_USER_AGENT
        value: Onovi-Israel-Address-App/1.0
    healthCheckPath: /

  # Frontend Static Site
  - type: web
    name: onovi-client
    env: static
    region: oregon
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
