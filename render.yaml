# Render Blueprint for Lomea Application
# This file defines the infrastructure for deploying Lomea on Render.com

# Database
databases:
  - name: lomea-db
    databaseName: lomea_production
    user: lomea
    region: oregon
    plan: starter  # Free tier - upgrade to starter for production
    ipAllowList: []  # Empty means accessible from anywhere

# Backend API Service
services:
  - type: web
    name: lomea-api
    env: node
    region: oregon
    plan: starter  # Free tier - upgrade to starter for production
    buildCommand: cd server && npm install && npx prisma generate
    startCommand: cd server && npm run db:migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lomea-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Trust the Render reverse proxy so rate limiting uses the real client IP
      # (X-Forwarded-For). "1" trusts a single proxy hop.
      - key: TRUST_PROXY
        value: 1
      # Explicit CORS allowlist for the production frontend. Defaults to the
      # Render-generated host of the "lomea-client" static site defined below.
      # Override this value (comma-separated) when serving the frontend from a
      # custom domain.
      - key: CORS_ORIGIN
        value: https://lomea-client.onrender.com
      - key: NOMINATIM_USER_AGENT
        value: Lomea-Israel-Address-App/1.0
    healthCheckPath: /

  # Frontend Static Site
  - type: web
    name: lomea-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
